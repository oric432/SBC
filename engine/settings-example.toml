[logging]
level = "info"
pjsip_level = "disabled"
# Optional per-category overrides of `level` above. Category names match the
# spdlog sub-loggers in src/core/utils/log.hpp (app/sip/call/sm/rtp/pjsip); a
# category not listed here inherits `level`. Example:
# [logging.categories]
# sip = "warn"

[sip]
address = "127.0.0.1"
# Address advertised in rewritten SDP and Contact headers. Leave unset (or
# "") for a single-homed deployment, where it's the same as `address`. Set
# this separately behind NAT/a reverse proxy/on a multi-homed host, where
# `address` is the interface to bind and this is the reachable public IP.
advertised_address = ""
port = 5060
identity_user = "sbc"
# How long to wait for the callee to answer an outbound INVITE before giving
# up and reporting a timeout to the caller (PJSIP default: 32000).
invite_timeout_ms = 32000
# End an established call after no RTP is received from either leg for this
# many seconds. Set to 0 to disable RTP inactivity detection.
rtp_inactivity_timeout_s = 60

[control_plane]
ws_url = "ws://127.0.0.1:3001/ws/engine"
connect_timeout_s = 5
retry_interval_s = 5

[registrar]
# Below this, a REGISTER is rejected with 423 Interval Too Brief.
min_expires_s = 60
# Also the expiry granted when a REGISTER specifies none at all.
max_expires_s = 120
# How often to drop registrations that expired without an explicit
# de-register. Set to 0 to disable sweeping.
binding_sweep_interval_s = 60
