[logging]
level = "info"
pjsip_level = "disabled"

[sip]
address = "127.0.0.1"
port = 5060
identity_user = "sbc"
# How long to wait for the callee to answer an outbound INVITE before giving
# up and reporting a timeout to the caller (PJSIP default: 32000).
invite_timeout_ms = 32000

[control_plane]
http_url = "http://127.0.0.1:3001"
http_timeout_s = 5
http_retry_interval_s = 5
