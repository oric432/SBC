version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/control-plane/backend"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/control-plane/frontend"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 0

# open-pull-requests-limit: 0 -- PAUSED. The first real run cascaded into
# 30+ PRs across several rounds (each merge unblocked the next round of
# transitive/peer bumps), most of them major-version breaking changes
# needing real migration work, not something to churn through as drive-by
# dependency bumps. This keeps the config (and Dependabot security alerts,
# which are separate from this file) intact, but stops it from opening any
# more version-update PRs until someone deliberately sets a real limit again
# and works through the backlog on purpose.
#
# Not covered even when re-enabled: engine/ C++ dependencies. They come
# through CMake FetchContent (engine/third_party/*/declare.cmake), which
# Dependabot has no ecosystem support for -- those still need manual version
# bumps.
