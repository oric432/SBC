name: On-demand Gemini review

# Selective, not automatic: only fires when the project lead comments
# "/gemini-review" on a PR (restricted to a single username, not "any
# collaborator" -- teammates can't trigger this one). CodeRabbit (see
# .coderabbit.yaml) is the automatic first-pass reviewer on every PR; this is
# the deeper second opinion for PRs that actually warrant it
# (SM/threading/ownership-sensitive changes) -- see root AGENTS.md and the PR
# that introduced this workflow.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/gemini-review') &&
      github.event.comment.user.login == 'oric432'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Gemini review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: .github/scripts/gemini_review.sh
