name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: engine

jobs:
  # Required status checks must always report *something*, or a PR that never
  # touches engine/ leaves build-lint-test/asan-ubsan stuck "Expected —
  # waiting" forever (path-filtering the whole workflow's `on:` trigger, as
  # this used to do, means no run — and no status — ever gets created at all).
  # Gating each job's own `if:` on this job's output instead means an
  # untouched job still runs (trivially) and reports "skipped", which branch
  # protection accepts as passing.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      # Full history: push events diff locally against the prior commit, and
      # a shallow (default depth-1) checkout wouldn't have it to diff against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'engine/**'
              - '.github/workflows/ci.yml'

  build-lint-test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `just lint-changed` can diff against the PR's
          # merge-base (or the prior commit, on a push to main).
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy clang-format ninja-build just ccache sip-tester

      - name: Grant SIPp CAP_NET_RAW (needed for pcap audio playback)
        run: sudo setcap cap_net_raw+ep "$(readlink -f "$(command -v sipp)")"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: engine/build/_deps
          key: deps-${{ runner.os }}-debug-${{ hashFiles('engine/third_party/**/declare.cmake', 'engine/third_party/**/configure.cmake') }}
          restore-keys: |
            deps-${{ runner.os }}-debug-

      - name: Build (debug preset, clang-tidy off)
        run: just build-dev

      - name: Run unit tests
        run: just test

      - name: Run B2BUA integration tests
        run: just test-b2bua

      - name: Determine lint base
        id: lint-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      # Only clang-tidys files this PR (or push) actually changed, to keep
      # per-PR CI time down. A weekly full-repo sweep (clang-tidy-weekly.yml)
      # is the safety net for what this misses -- e.g. a header-only change
      # whose includers aren't touched in the same PR.
      - name: Lint changed files (clang-tidy)
        run: just lint-changed ${{ steps.lint-base.outputs.sha }}

      - name: Check formatting (non-mutating)
        run: just format-check

  asan-ubsan:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build just ccache

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: engine/build/_deps
          key: deps-${{ runner.os }}-asan-ubsan-${{ hashFiles('engine/third_party/**/declare.cmake', 'engine/third_party/**/configure.cmake') }}
          restore-keys: |
            deps-${{ runner.os }}-asan-ubsan-

      - name: Build (ASan + UBSan)
        run: just build-asan

      - name: Run unit tests under ASan + UBSan
        run: just test-asan
