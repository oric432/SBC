name: CI

on:
  pull_request:
    branches: [main]
    paths: ["engine/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: engine

jobs:
  build-lint-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy clang-format ninja-build just ccache

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: engine/build/_deps
          key: deps-${{ runner.os }}-debug-${{ hashFiles('engine/third_party/**/declare.cmake', 'engine/third_party/**/configure.cmake') }}
          restore-keys: |
            deps-${{ runner.os }}-debug-

      - name: Build (ci-debug preset, clang-tidy on)
        run: just build-ci

      - name: Run unit tests
        run: just test-ci

      - name: Check formatting (non-mutating)
        run: just format-check
