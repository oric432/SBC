name: Control Plane CI

on:
  pull_request:
    branches: [main]
    paths: ["control-plane/**", ".github/workflows/control-plane-ci.yml"]
  push:
    branches: [main]
    paths: ["control-plane/**", ".github/workflows/control-plane-ci.yml"]

concurrency:
  group: control-plane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: control-plane/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # package-lock.json is gitignored in this project (not committed), so
      # there's no lockfile for `npm ci` or setup-node's npm cache to key on.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: control-plane/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # package-lock.json is gitignored in this project (not committed), so
      # there's no lockfile for `npm ci` or setup-node's npm cache to key on.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
